name: Execucao Bisemanal - Busca Geral de Empresas

on:
  schedule:
    # Roda Terças (2) e Quintas (4) às 09:00 no Horário de Brasília (12:00 UTC)
    - cron: '0 12 * * 2,4'
  workflow_dispatch: # Permite disparar manualmente pelo GitHub Actions

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install apify-client requests

      - name: Executar Script de Busca Geral
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOEL_EMAIL_ADDRESS: ${{ secrets.JOEL_EMAIL_ADDRESS }}
          JOEL_EMAIL_PASSWORD: ${{ secrets.JOEL_EMAIL_PASSWORD }}
        run: |
          python buscar_empresas_aleatorias_github.py

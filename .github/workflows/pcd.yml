name: Execucao Semanal PCD

on:
  schedule:
    # Roda às 14:15 UTC (11:15 no Horário de Brasília)
    - cron: '15 14 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install apify-client requests

      - name: Executar Script PCD
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          JOEL_OWNER_ID: ${{ secrets.JOEL_OWNER_ID }}
          JOEL_EMAIL_ADDRESS: ${{ secrets.JOEL_EMAIL_ADDRESS }}
          JOEL_EMAIL_PASSWORD: ${{ secrets.JOEL_EMAIL_PASSWORD }}
        run: |
          python buscar_empresas_pcd_github.py
